<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard &mdash; Weeks Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            term: { green: '#22c55e', dim: '#86efac', bg: '#0a0a0a', card: '#111111', border: '#1e1e1e', muted: '#666', surface: '#161616' },
            accent: '#a78bfa',
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #0a0a0a; }
    .glow { text-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
    .card-glow:hover { box-shadow: 0 0 30px rgba(34, 197, 94, 0.06); border-color: #22c55e20; }
    ::selection { background: #22c55e; color: #000; }
    .sidebar-link { transition: all 0.15s ease; }
    .sidebar-link:hover { background: rgba(34, 197, 94, 0.08); color: #22c55e; }
    .sidebar-link.active { background: rgba(34, 197, 94, 0.1); color: #22c55e; border-left: 2px solid #22c55e; }
  </style>
</head>
<body class="bg-term-bg text-gray-300 antialiased" x-data="dashboard()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-60 bg-term-card border-r border-term-border shrink-0">
      <div class="h-14 flex items-center px-5 border-b border-term-border">
        <a href="index.html" class="flex items-center gap-2 font-mono text-sm">
          <span class="text-term-green font-bold">~/</span>
          <span class="text-white font-bold">weeks-web</span>
        </a>
      </div>

      <nav class="flex-1 py-4 space-y-0.5">
        <a href="#" @click.prevent="page='overview'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'overview' ? 'active' : 'text-term-muted'">
          <span class="w-4 text-center opacity-60">~</span> overview
        </a>
        <a href="#" @click.prevent="page='bookings'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'bookings' ? 'active' : 'text-term-muted'">
          <span class="w-4 text-center opacity-60">~</span> bookings
          <span class="ml-auto font-mono text-xs bg-term-green/15 text-term-green px-1.5 py-0.5 rounded">12</span>
        </a>
        <a href="#" @click.prevent="page='clients'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'clients' ? 'active' : 'text-term-muted'">
          <span class="w-4 text-center opacity-60">~</span> clients
        </a>
        <a href="#" @click.prevent="page='payments'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'payments' ? 'active' : 'text-term-muted'">
          <span class="w-4 text-center opacity-60">~</span> payments
        </a>
        <a href="#" @click.prevent="page='invoices'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'invoices' ? 'active' : 'text-term-muted'">
          <span class="w-4 text-center opacity-60">~</span> invoices
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono text-term-muted">
          <span class="w-4 text-center opacity-60">~</span> analytics
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono text-term-muted">
          <span class="w-4 text-center opacity-60">~</span> automations
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono text-term-muted">
          <span class="w-4 text-center opacity-60">~</span> settings
        </a>
      </nav>

      <div class="p-4 border-t border-term-border">
        <div class="bg-term-surface rounded-lg p-4 border border-term-border">
          <div class="font-mono text-xs text-term-green mb-1">active client:</div>
          <div class="text-sm font-bold text-white">Zany's Play World</div>
          <div class="font-mono text-xs text-term-muted mt-1">zanysplayworld.com</div>
          <div class="mt-3 w-full bg-term-border rounded-full h-1">
            <div class="bg-term-green h-1 rounded-full" style="width: 72%"></div>
          </div>
          <div class="font-mono text-xs text-term-muted mt-1.5">72% monthly capacity</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto">
      <!-- Top bar -->
      <header class="h-14 bg-term-card border-b border-term-border flex items-center justify-between px-6 sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <div class="lg:hidden font-mono text-sm">
            <span class="text-term-green">~/</span><span class="text-white font-bold">weeks-web</span>
          </div>
          <h1 class="font-mono text-sm text-term-muted" x-text="'$ cd ./' + page"></h1>
        </div>
        <div class="flex items-center gap-4">
          <div class="relative">
            <div class="w-2 h-2 bg-term-green rounded-full absolute -top-0.5 -right-0.5 animate-pulse"></div>
            <svg class="w-4 h-4 text-term-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-term-green/20 rounded-md flex items-center justify-center">
              <span class="text-term-green font-mono text-xs font-bold">ZP</span>
            </div>
            <div class="hidden sm:block font-mono text-xs">
              <div class="text-white">Zany's Admin</div>
              <div class="text-term-muted">owner</div>
            </div>
          </div>
        </div>
      </header>

      <div class="p-6 max-w-7xl mx-auto">

        <!-- Overview -->
        <template x-if="page === 'overview'">
          <div>
            <!-- Period -->
            <div class="flex items-center gap-2 mb-6">
              <template x-for="p in ['7d', '30d', '90d', '12m']">
                <button @click="period = p"
                        class="px-3 py-1.5 text-xs font-mono rounded-md transition"
                        :class="period === p ? 'bg-term-green text-black font-bold' : 'bg-term-card text-term-muted border border-term-border hover:border-term-green/30'"
                        x-text="p">
                </button>
              </template>
            </div>

            <!-- KPIs -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div class="bg-term-card rounded-xl border border-term-border p-5 card-glow transition-all duration-300">
                <div class="font-mono text-xs text-term-muted mb-2">MRR</div>
                <div class="text-2xl font-black text-white">$18,420</div>
                <div class="font-mono text-xs text-term-green mt-1">+12.5%</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-term-green/20 rounded-t" style="height:40%"></div>
                  <div class="flex-1 bg-term-green/20 rounded-t" style="height:55%"></div>
                  <div class="flex-1 bg-term-green/20 rounded-t" style="height:45%"></div>
                  <div class="flex-1 bg-term-green/20 rounded-t" style="height:60%"></div>
                  <div class="flex-1 bg-term-green/20 rounded-t" style="height:70%"></div>
                  <div class="flex-1 bg-term-green/25 rounded-t" style="height:65%"></div>
                  <div class="flex-1 bg-term-green/30 rounded-t" style="height:80%"></div>
                  <div class="flex-1 bg-term-green/30 rounded-t" style="height:75%"></div>
                  <div class="flex-1 bg-term-green/35 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-term-green/40 rounded-t" style="height:90%"></div>
                  <div class="flex-1 bg-term-green/45 rounded-t" style="height:88%"></div>
                  <div class="flex-1 bg-term-green rounded-t" style="height:100%"></div>
                </div>
              </div>

              <div class="bg-term-card rounded-xl border border-term-border p-5 card-glow transition-all duration-300">
                <div class="font-mono text-xs text-term-muted mb-2">ACTIVE CLIENTS</div>
                <div class="text-2xl font-black text-white">284</div>
                <div class="font-mono text-xs text-term-green mt-1">+8 this month</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-accent/20 rounded-t" style="height:50%"></div>
                  <div class="flex-1 bg-accent/20 rounded-t" style="height:55%"></div>
                  <div class="flex-1 bg-accent/25 rounded-t" style="height:58%"></div>
                  <div class="flex-1 bg-accent/25 rounded-t" style="height:62%"></div>
                  <div class="flex-1 bg-accent/25 rounded-t" style="height:68%"></div>
                  <div class="flex-1 bg-accent/30 rounded-t" style="height:72%"></div>
                  <div class="flex-1 bg-accent/30 rounded-t" style="height:75%"></div>
                  <div class="flex-1 bg-accent/35 rounded-t" style="height:80%"></div>
                  <div class="flex-1 bg-accent/35 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-accent/40 rounded-t" style="height:88%"></div>
                  <div class="flex-1 bg-accent/45 rounded-t" style="height:92%"></div>
                  <div class="flex-1 bg-accent rounded-t" style="height:95%"></div>
                </div>
              </div>

              <div class="bg-term-card rounded-xl border border-term-border p-5 card-glow transition-all duration-300">
                <div class="font-mono text-xs text-term-muted mb-2">BOOKINGS</div>
                <div class="text-2xl font-black text-white">1,247</div>
                <div class="font-mono text-xs text-term-green mt-1">+23%</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-blue-500/20 rounded-t" style="height:35%"></div>
                  <div class="flex-1 bg-blue-500/20 rounded-t" style="height:45%"></div>
                  <div class="flex-1 bg-blue-500/25 rounded-t" style="height:55%"></div>
                  <div class="flex-1 bg-blue-500/25 rounded-t" style="height:50%"></div>
                  <div class="flex-1 bg-blue-500/30 rounded-t" style="height:65%"></div>
                  <div class="flex-1 bg-blue-500/30 rounded-t" style="height:70%"></div>
                  <div class="flex-1 bg-blue-500/30 rounded-t" style="height:60%"></div>
                  <div class="flex-1 bg-blue-500/35 rounded-t" style="height:75%"></div>
                  <div class="flex-1 bg-blue-500/40 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-blue-500/40 rounded-t" style="height:80%"></div>
                  <div class="flex-1 bg-blue-500/45 rounded-t" style="height:92%"></div>
                  <div class="flex-1 bg-blue-500 rounded-t" style="height:100%"></div>
                </div>
              </div>

              <div class="bg-term-card rounded-xl border border-term-border p-5 card-glow transition-all duration-300">
                <div class="font-mono text-xs text-term-muted mb-2">RETENTION</div>
                <div class="text-2xl font-black text-white">94.8%</div>
                <div class="font-mono text-xs text-term-green mt-1">+1.2%</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-emerald-500/30 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-emerald-500/30 rounded-t" style="height:87%"></div>
                  <div class="flex-1 bg-emerald-500/35 rounded-t" style="height:86%"></div>
                  <div class="flex-1 bg-emerald-500/35 rounded-t" style="height:88%"></div>
                  <div class="flex-1 bg-emerald-500/35 rounded-t" style="height:90%"></div>
                  <div class="flex-1 bg-emerald-500/35 rounded-t" style="height:89%"></div>
                  <div class="flex-1 bg-emerald-500/40 rounded-t" style="height:91%"></div>
                  <div class="flex-1 bg-emerald-500/40 rounded-t" style="height:92%"></div>
                  <div class="flex-1 bg-emerald-500/40 rounded-t" style="height:93%"></div>
                  <div class="flex-1 bg-emerald-500/45 rounded-t" style="height:93%"></div>
                  <div class="flex-1 bg-emerald-500/45 rounded-t" style="height:94%"></div>
                  <div class="flex-1 bg-emerald-500 rounded-t" style="height:95%"></div>
                </div>
              </div>
            </div>

            <!-- Revenue + Activity -->
            <div class="grid lg:grid-cols-3 gap-4 mb-8">
              <div class="lg:col-span-2 bg-term-card rounded-xl border border-term-border p-6">
                <div class="flex items-center justify-between mb-6">
                  <h3 class="font-mono text-sm text-white">revenue breakdown</h3>
                  <span class="font-mono text-xs text-term-muted">mar 2026</span>
                </div>
                <div class="space-y-4">
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-term-muted">subscriptions</span>
                      <span class="text-white font-bold">$12,840</span>
                    </div>
                    <div class="w-full bg-term-border rounded-full h-2">
                      <div class="bg-term-green h-2 rounded-full" style="width: 70%"></div>
                    </div>
                  </div>
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-term-muted">one-time services</span>
                      <span class="text-white font-bold">$3,280</span>
                    </div>
                    <div class="w-full bg-term-border rounded-full h-2">
                      <div class="bg-accent h-2 rounded-full" style="width: 42%"></div>
                    </div>
                  </div>
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-term-muted">gift cards</span>
                      <span class="text-white font-bold">$1,580</span>
                    </div>
                    <div class="w-full bg-term-border rounded-full h-2">
                      <div class="bg-blue-500 h-2 rounded-full" style="width: 25%"></div>
                    </div>
                  </div>
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-term-muted">events + camps</span>
                      <span class="text-white font-bold">$720</span>
                    </div>
                    <div class="w-full bg-term-border rounded-full h-2">
                      <div class="bg-amber-500 h-2 rounded-full" style="width: 12%"></div>
                    </div>
                  </div>
                </div>
                <div class="mt-6 pt-4 border-t border-term-border flex justify-between font-mono text-sm">
                  <span class="text-white font-bold">total</span>
                  <span class="text-term-green font-black text-lg">$18,420</span>
                </div>
              </div>

              <div class="bg-term-card rounded-xl border border-term-border p-6">
                <h3 class="font-mono text-sm text-white mb-4">recent activity</h3>
                <div class="space-y-3">
                  <template x-for="item in activity" :key="item.id">
                    <div class="flex gap-3">
                      <div class="font-mono text-xs w-6 text-center shrink-0" :class="item.color" x-text="item.icon"></div>
                      <div class="min-w-0">
                        <p class="text-sm text-gray-300 truncate" x-text="item.text"></p>
                        <p class="font-mono text-xs text-term-muted mt-0.5" x-text="item.time"></p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Bookings + Tasks -->
            <div class="grid lg:grid-cols-2 gap-4 mb-8">
              <div class="bg-term-card rounded-xl border border-term-border p-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-mono text-sm text-white">today's bookings</h3>
                  <span class="font-mono text-xs bg-term-green/15 text-term-green px-2 py-0.5 rounded">12</span>
                </div>
                <div class="space-y-2">
                  <template x-for="b in bookings" :key="b.id">
                    <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-term-surface transition">
                      <div class="w-8 h-8 rounded-md flex items-center justify-center font-mono text-xs font-bold" :class="b.avatarColor">
                        <span x-text="b.initials"></span>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                          <span class="text-sm text-white truncate" x-text="b.name"></span>
                          <span class="font-mono text-xs text-term-muted" x-text="b.time"></span>
                        </div>
                        <div class="font-mono text-xs text-term-muted mt-0.5" x-text="b.service"></div>
                      </div>
                      <span class="font-mono text-xs px-2 py-0.5 rounded" :class="b.statusColor" x-text="b.status"></span>
                    </div>
                  </template>
                </div>
              </div>

              <div class="bg-term-card rounded-xl border border-term-border p-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-mono text-sm text-white">ops tasks</h3>
                  <span class="font-mono text-xs bg-amber-500/15 text-amber-400 px-2 py-0.5 rounded">4 open</span>
                </div>
                <div class="space-y-2">
                  <template x-for="t in tasks" :key="t.id">
                    <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-term-surface transition">
                      <div class="w-4 h-4 rounded border flex items-center justify-center shrink-0 font-mono"
                           :class="t.done ? 'border-term-green bg-term-green/20 text-term-green' : 'border-term-border'">
                        <span x-show="t.done" class="text-xs">+</span>
                      </div>
                      <span class="text-sm flex-1" :class="t.done ? 'text-term-muted line-through' : 'text-gray-300'" x-text="t.text"></span>
                      <span class="font-mono text-xs px-2 py-0.5 rounded" :class="t.priorityColor" x-text="t.priority"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Subscriptions -->
            <div class="bg-term-card rounded-xl border border-term-border p-6">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-mono text-sm text-white">active clients</h3>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="text-left font-mono text-xs text-term-muted border-b border-term-border">
                      <th class="pb-3">client</th>
                      <th class="pb-3">type</th>
                      <th class="pb-3">plan</th>
                      <th class="pb-3">mrr</th>
                      <th class="pb-3">status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-term-border">
                    <template x-for="s in subscriptions" :key="s.name">
                      <tr class="hover:bg-term-surface">
                        <td class="py-3">
                          <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded-md flex items-center justify-center font-mono text-xs font-bold" :class="s.avatarColor">
                              <span x-text="s.initials"></span>
                            </div>
                            <div>
                              <div class="text-white font-medium" x-text="s.name"></div>
                              <div class="font-mono text-xs text-term-muted" x-text="s.domain"></div>
                            </div>
                          </div>
                        </td>
                        <td class="py-3 font-mono text-xs text-term-muted" x-text="s.type"></td>
                        <td class="py-3 font-mono text-xs text-gray-400" x-text="s.plan"></td>
                        <td class="py-3 font-mono text-sm text-white font-bold" x-text="s.mrr"></td>
                        <td class="py-3">
                          <span class="font-mono text-xs px-2 py-0.5 rounded" :class="s.statusColor" x-text="s.status"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </template>

        <!-- Bookings Page -->
        <template x-if="page === 'bookings'">
          <div>
            <div class="flex items-center justify-between mb-6">
              <button class="bg-term-green text-black text-sm font-bold font-mono px-4 py-2 rounded-lg hover:bg-term-dim transition">+ new booking</button>
              <div class="flex gap-2">
                <button class="px-3 py-1.5 font-mono text-xs rounded-md bg-term-card text-term-muted border border-term-border">today</button>
                <button class="px-3 py-1.5 font-mono text-xs rounded-md bg-term-card text-term-muted border border-term-border">this week</button>
                <button class="px-3 py-1.5 font-mono text-xs rounded-md bg-term-green text-black font-bold">this month</button>
              </div>
            </div>
            <div class="bg-term-card rounded-xl border border-term-border overflow-hidden">
              <div class="grid grid-cols-7 border-b border-term-border">
                <template x-for="day in ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']">
                  <div class="p-3 text-center font-mono text-xs text-term-muted border-r border-term-border last:border-r-0" x-text="day"></div>
                </template>
              </div>
              <div class="grid grid-cols-7">
                <template x-for="d in calendarDays" :key="d.day">
                  <div class="min-h-[100px] p-2 border-r border-b border-term-border" :class="d.today ? 'bg-term-green/5' : ''">
                    <div class="font-mono text-sm mb-1" :class="d.today ? 'text-term-green font-bold' : d.current ? 'text-gray-400' : 'text-term-border'" x-text="d.day"></div>
                    <template x-for="ev in d.events">
                      <div class="font-mono text-xs px-1.5 py-0.5 rounded mb-0.5 truncate" :class="ev.color" x-text="ev.text"></div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- Clients Page -->
        <template x-if="page === 'clients'">
          <div>
            <div class="flex items-center justify-between mb-6">
              <div class="relative">
                <span class="font-mono text-term-muted absolute left-3 top-1/2 -translate-y-1/2 text-sm">$</span>
                <input type="text" placeholder="grep clients..." class="pl-8 pr-4 py-2 bg-term-card border border-term-border rounded-lg font-mono text-sm text-white focus:outline-none focus:border-term-green/50 w-64 placeholder:text-term-muted">
              </div>
