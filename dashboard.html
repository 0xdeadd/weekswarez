        </div>

      <!-- Page content -->
      <div class="p-6 max-w-7xl mx-auto">

        <!-- Overview Page -->

          <div>

            <div class="flex items-center gap-2 mb-6">
              <template x-for="p in ['7d', '30d', '90d', '12m']">

                        :class="period === p ? 'bg-brand-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'"

              </template>
            </div>

            <!-- KPI Cards -->

                  <div class="flex-1 bg-purple-400 rounded-t" style="height:62%"></div>

                  <div class="flex-1 bg-purple-400 rounded-t" style="height:75%"></div>
                  <div class="flex-1 bg-purple-400 rounded-t" style="height:80%"></div>

                      <span class="font-semibold text-gray-900">$12,840</span>

                    <div class="w-full bg-gray-100 rounded-full h-2.5">

                  </div>

                <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between">
                  <span class="text-sm font-semibold text-gray-900">Total Revenue</span>

                    <div class="flex gap-3">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-xs font-bold"

                        <span x-text="item.icon"></span>
                      </div>
                      <div class="min-w-0">
                        <p class="text-sm text-gray-900 truncate" x-text="item.text"></p>
                        <p class="text-xs text-gray-500 mt-0.5" x-text="item.time"></p>
                      </div>
                    </div>
                  </template>
