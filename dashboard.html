<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard &mdash; Partybook</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: #16a34a; color: #fff; }
    .sidebar-link { transition: all 0.15s ease; }
    .sidebar-link:hover { background: #f5f5f5; color: #16a34a; }
    .sidebar-link.active { background: #f0fdf4; color: #16a34a; border-left: 2px solid #16a34a; }
    .dark .sidebar-link:hover { background: rgba(34, 197, 94, 0.08); color: #22c55e; }
    .dark .sidebar-link.active { background: rgba(34, 197, 94, 0.1); color: #22c55e; border-left: 2px solid #22c55e; }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-[#0a0a0a] text-gray-900 dark:text-gray-300 antialiased transition-colors duration-200" x-data="dashboard()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-60 bg-white dark:bg-[#111] border-r border-neutral-200 dark:border-neutral-800 shrink-0">
      <div class="h-14 flex items-center px-5 border-b border-neutral-200 dark:border-neutral-800">
        <a href="index.html" class="flex items-center gap-2 font-mono text-sm">
          <span class="text-green-600 dark:text-green-500 font-bold">~/</span>
          <span class="text-gray-900 dark:text-white font-bold">partybook</span>
        </a>
      </div>

      <nav class="flex-1 py-4 space-y-0.5">
        <a href="#" @click.prevent="page='overview'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'overview' ? 'active' : 'text-neutral-500 dark:text-neutral-500'">
          <span class="w-4 text-center opacity-60">~</span> overview
        </a>
        <a href="#" @click.prevent="page='bookings'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'bookings' ? 'active' : 'text-neutral-500 dark:text-neutral-500'">
          <span class="w-4 text-center opacity-60">~</span> bookings
          <span class="ml-auto font-mono text-xs bg-green-50 dark:bg-green-500/10 text-green-600 dark:text-green-500 border border-green-200 dark:border-green-500/20 px-1.5 py-0.5 rounded">12</span>
        </a>
        <a href="#" @click.prevent="page='clients'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'clients' ? 'active' : 'text-neutral-500 dark:text-neutral-500'">
          <span class="w-4 text-center opacity-60">~</span> clients
        </a>
        <a href="#" @click.prevent="page='payments'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'payments' ? 'active' : 'text-neutral-500 dark:text-neutral-500'">
          <span class="w-4 text-center opacity-60">~</span> payments
        </a>
        <a href="#" @click.prevent="page='invoices'" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono"
           :class="page === 'invoices' ? 'active' : 'text-neutral-500 dark:text-neutral-500'">
          <span class="w-4 text-center opacity-60">~</span> invoices
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono text-neutral-500">
          <span class="w-4 text-center opacity-60">~</span> analytics
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono text-neutral-500">
          <span class="w-4 text-center opacity-60">~</span> automations
        </a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-5 py-2.5 text-sm font-mono text-neutral-500">
          <span class="w-4 text-center opacity-60">~</span> settings
        </a>
      </nav>

      <div class="p-4 border-t border-neutral-200 dark:border-neutral-800">
        <div class="bg-neutral-50 dark:bg-[#1a1a1a] rounded-lg p-4 border border-neutral-200 dark:border-neutral-800">
          <div class="font-mono text-xs text-green-600 dark:text-green-500 mb-1">active client:</div>
          <div class="text-sm font-bold text-gray-900 dark:text-white">Zany's Play World</div>
          <div class="font-mono text-xs text-neutral-500 mt-1">zanysplayworld.com</div>
          <div class="mt-3 w-full bg-neutral-200 dark:bg-neutral-700 rounded-full h-1.5">
            <div class="bg-green-600 dark:bg-green-500 h-1.5 rounded-full" style="width: 72%"></div>
          </div>
          <div class="font-mono text-xs text-neutral-500 mt-1.5">72% monthly capacity</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto">
      <header class="h-14 bg-white dark:bg-[#111] border-b border-neutral-200 dark:border-neutral-800 flex items-center justify-between px-6 sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <div class="lg:hidden font-mono text-sm">
            <span class="text-green-600 dark:text-green-500">~/</span><span class="text-gray-900 dark:text-white font-bold">partybook</span>
          </div>
          <h1 class="font-mono text-sm text-neutral-500" x-text="'$ cd ./' + page"></h1>
        </div>
        <div class="flex items-center gap-4">
          <!-- Theme toggle -->
          <button @click="dark = !dark; document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', dark ? 'dark' : 'light')"
                  class="p-1.5 rounded-md border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition" title="Toggle theme">
            <svg x-show="!dark" class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg x-show="dark" class="w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
          <div class="relative">
            <div class="w-2 h-2 bg-green-500 rounded-full absolute -top-0.5 -right-0.5 animate-pulse"></div>
            <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-green-50 dark:bg-green-500/10 rounded-md flex items-center justify-center border border-green-200 dark:border-green-500/20">
              <span class="text-green-600 dark:text-green-500 font-mono text-xs font-bold">ZP</span>
            </div>
            <div class="hidden sm:block font-mono text-xs">
              <div class="text-gray-900 dark:text-white">Zany's Admin</div>
              <div class="text-neutral-500">owner</div>
            </div>
          </div>
        </div>
      </header>

      <div class="p-6 max-w-7xl mx-auto">

        <!-- Overview -->
        <template x-if="page === 'overview'">
          <div>
            <div class="flex items-center gap-2 mb-6">
              <template x-for="p in ['7d', '30d', '90d', '12m']">
                <button @click="period = p"
                        class="px-3 py-1.5 text-xs font-mono rounded-md transition"
                        :class="period === p ? 'bg-gray-900 dark:bg-green-600 text-white font-bold' : 'bg-white dark:bg-[#1a1a1a] text-neutral-500 border border-neutral-200 dark:border-neutral-800 hover:border-neutral-400 dark:hover:border-neutral-600'"
                        x-text="p">
                </button>
              </template>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-5">
                <div class="font-mono text-xs text-neutral-500 mb-2">MRR</div>
                <div class="text-2xl font-black text-gray-900 dark:text-white">$18,420</div>
                <div class="font-mono text-xs text-green-600 dark:text-green-500 mt-1">+12.5%</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-green-100 dark:bg-green-500/15 rounded-t" style="height:40%"></div>
                  <div class="flex-1 bg-green-100 dark:bg-green-500/15 rounded-t" style="height:55%"></div>
                  <div class="flex-1 bg-green-100 dark:bg-green-500/20 rounded-t" style="height:45%"></div>
                  <div class="flex-1 bg-green-200 dark:bg-green-500/20 rounded-t" style="height:60%"></div>
                  <div class="flex-1 bg-green-200 dark:bg-green-500/25 rounded-t" style="height:70%"></div>
                  <div class="flex-1 bg-green-200 dark:bg-green-500/25 rounded-t" style="height:65%"></div>
                  <div class="flex-1 bg-green-300 dark:bg-green-500/30 rounded-t" style="height:80%"></div>
                  <div class="flex-1 bg-green-300 dark:bg-green-500/35 rounded-t" style="height:75%"></div>
                  <div class="flex-1 bg-green-400 dark:bg-green-500/40 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-green-400 dark:bg-green-500/45 rounded-t" style="height:90%"></div>
                  <div class="flex-1 bg-green-500 dark:bg-green-500/50 rounded-t" style="height:88%"></div>
                  <div class="flex-1 bg-green-600 dark:bg-green-500 rounded-t" style="height:100%"></div>
                </div>
              </div>
              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-5">
                <div class="font-mono text-xs text-neutral-500 mb-2">ACTIVE CLIENTS</div>
                <div class="text-2xl font-black text-gray-900 dark:text-white">284</div>
                <div class="font-mono text-xs text-green-600 dark:text-green-500 mt-1">+8 this month</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-purple-100 dark:bg-purple-500/15 rounded-t" style="height:50%"></div>
                  <div class="flex-1 bg-purple-100 dark:bg-purple-500/20 rounded-t" style="height:58%"></div>
                  <div class="flex-1 bg-purple-200 dark:bg-purple-500/25 rounded-t" style="height:65%"></div>
                  <div class="flex-1 bg-purple-200 dark:bg-purple-500/30 rounded-t" style="height:72%"></div>
                  <div class="flex-1 bg-purple-300 dark:bg-purple-500/35 rounded-t" style="height:78%"></div>
                  <div class="flex-1 bg-purple-300 dark:bg-purple-500/35 rounded-t" style="height:82%"></div>
                  <div class="flex-1 bg-purple-400 dark:bg-purple-500/40 rounded-t" style="height:86%"></div>
                  <div class="flex-1 bg-purple-400 dark:bg-purple-500/45 rounded-t" style="height:89%"></div>
                  <div class="flex-1 bg-purple-500 dark:bg-purple-500/50 rounded-t" style="height:91%"></div>
                  <div class="flex-1 bg-purple-500 dark:bg-purple-500/55 rounded-t" style="height:93%"></div>
                  <div class="flex-1 bg-purple-500 dark:bg-purple-500/60 rounded-t" style="height:94%"></div>
                  <div class="flex-1 bg-purple-600 dark:bg-purple-500 rounded-t" style="height:95%"></div>
                </div>
              </div>
              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-5">
                <div class="font-mono text-xs text-neutral-500 mb-2">BOOKINGS</div>
                <div class="text-2xl font-black text-gray-900 dark:text-white">1,247</div>
                <div class="font-mono text-xs text-green-600 dark:text-green-500 mt-1">+23%</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-blue-100 dark:bg-blue-500/15 rounded-t" style="height:35%"></div>
                  <div class="flex-1 bg-blue-100 dark:bg-blue-500/20 rounded-t" style="height:50%"></div>
                  <div class="flex-1 bg-blue-200 dark:bg-blue-500/25 rounded-t" style="height:60%"></div>
                  <div class="flex-1 bg-blue-200 dark:bg-blue-500/30 rounded-t" style="height:65%"></div>
                  <div class="flex-1 bg-blue-300 dark:bg-blue-500/35 rounded-t" style="height:70%"></div>
                  <div class="flex-1 bg-blue-300 dark:bg-blue-500/35 rounded-t" style="height:75%"></div>
                  <div class="flex-1 bg-blue-400 dark:bg-blue-500/40 rounded-t" style="height:80%"></div>
                  <div class="flex-1 bg-blue-400 dark:bg-blue-500/45 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-blue-500 dark:bg-blue-500/50 rounded-t" style="height:90%"></div>
                  <div class="flex-1 bg-blue-500 dark:bg-blue-500/55 rounded-t" style="height:92%"></div>
                  <div class="flex-1 bg-blue-500 dark:bg-blue-500/60 rounded-t" style="height:96%"></div>
                  <div class="flex-1 bg-blue-600 dark:bg-blue-500 rounded-t" style="height:100%"></div>
                </div>
              </div>
              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-5">
                <div class="font-mono text-xs text-neutral-500 mb-2">RETENTION</div>
                <div class="text-2xl font-black text-gray-900 dark:text-white">94.8%</div>
                <div class="font-mono text-xs text-green-600 dark:text-green-500 mt-1">+1.2%</div>
                <div class="mt-3 h-8 flex items-end gap-0.5">
                  <div class="flex-1 bg-emerald-100 dark:bg-emerald-500/25 rounded-t" style="height:85%"></div>
                  <div class="flex-1 bg-emerald-100 dark:bg-emerald-500/28 rounded-t" style="height:87%"></div>
                  <div class="flex-1 bg-emerald-200 dark:bg-emerald-500/30 rounded-t" style="height:88%"></div>
                  <div class="flex-1 bg-emerald-200 dark:bg-emerald-500/32 rounded-t" style="height:89%"></div>
                  <div class="flex-1 bg-emerald-200 dark:bg-emerald-500/35 rounded-t" style="height:90%"></div>
                  <div class="flex-1 bg-emerald-300 dark:bg-emerald-500/38 rounded-t" style="height:91%"></div>
                  <div class="flex-1 bg-emerald-300 dark:bg-emerald-500/40 rounded-t" style="height:92%"></div>
                  <div class="flex-1 bg-emerald-300 dark:bg-emerald-500/42 rounded-t" style="height:93%"></div>
                  <div class="flex-1 bg-emerald-400 dark:bg-emerald-500/45 rounded-t" style="height:93%"></div>
                  <div class="flex-1 bg-emerald-400 dark:bg-emerald-500/48 rounded-t" style="height:94%"></div>
                  <div class="flex-1 bg-emerald-500 dark:bg-emerald-500/55 rounded-t" style="height:94%"></div>
                  <div class="flex-1 bg-emerald-600 dark:bg-emerald-500 rounded-t" style="height:95%"></div>
                </div>
              </div>
            </div>

            <!-- Revenue + Activity -->
            <div class="grid lg:grid-cols-3 gap-4 mb-8">
              <div class="lg:col-span-2 bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-6">
                <div class="flex items-center justify-between mb-6">
                  <h3 class="font-mono text-sm text-gray-900 dark:text-white font-semibold">revenue breakdown</h3>
                  <span class="font-mono text-xs text-neutral-500">mar 2026</span>
                </div>
                <div class="space-y-4">
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-neutral-500">subscriptions</span>
                      <span class="text-gray-900 dark:text-white font-bold">$12,840</span>
                    </div>
                    <div class="w-full bg-neutral-100 dark:bg-neutral-800 rounded-full h-2.5">
                      <div class="bg-green-500 h-2.5 rounded-full" style="width: 70%"></div>
                    </div>
                  </div>
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-neutral-500">one-time services</span>
                      <span class="text-gray-900 dark:text-white font-bold">$3,280</span>
                    </div>
                    <div class="w-full bg-neutral-100 dark:bg-neutral-800 rounded-full h-2.5">
                      <div class="bg-purple-500 h-2.5 rounded-full" style="width: 42%"></div>
                    </div>
                  </div>
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-neutral-500">gift cards</span>
                      <span class="text-gray-900 dark:text-white font-bold">$1,580</span>
                    </div>
                    <div class="w-full bg-neutral-100 dark:bg-neutral-800 rounded-full h-2.5">
                      <div class="bg-blue-500 h-2.5 rounded-full" style="width: 25%"></div>
                    </div>
                  </div>
                  <div>
                    <div class="flex justify-between font-mono text-sm mb-1.5">
                      <span class="text-neutral-500">events + camps</span>
                      <span class="text-gray-900 dark:text-white font-bold">$720</span>
                    </div>
                    <div class="w-full bg-neutral-100 dark:bg-neutral-800 rounded-full h-2.5">
                      <div class="bg-amber-500 h-2.5 rounded-full" style="width: 12%"></div>
                    </div>
                  </div>
                </div>
                <div class="mt-6 pt-4 border-t border-neutral-200 dark:border-neutral-800 flex justify-between font-mono text-sm">
                  <span class="text-gray-900 dark:text-white font-bold">total</span>
                  <span class="text-green-600 dark:text-green-500 font-black text-lg">$18,420</span>
                </div>
              </div>

              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-6">
                <h3 class="font-mono text-sm text-gray-900 dark:text-white font-semibold mb-4">recent activity</h3>
                <div class="space-y-3">
                  <template x-for="item in activity" :key="item.id">
                    <div class="flex gap-3">
                      <div class="font-mono text-xs w-6 text-center shrink-0 mt-0.5" :class="item.color" x-text="item.icon"></div>
                      <div class="min-w-0">
                        <p class="text-sm text-gray-700 dark:text-gray-300 truncate" x-text="item.text"></p>
                        <p class="font-mono text-xs text-neutral-500 mt-0.5" x-text="item.time"></p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Bookings + Tasks -->
            <div class="grid lg:grid-cols-2 gap-4 mb-8">
              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-mono text-sm text-gray-900 dark:text-white font-semibold">today's bookings</h3>
                  <span class="font-mono text-xs bg-green-50 dark:bg-green-500/10 text-green-600 dark:text-green-500 border border-green-200 dark:border-green-500/20 px-2 py-0.5 rounded">12</span>
                </div>
                <div class="space-y-2">
                  <template x-for="b in bookings" :key="b.id">
                    <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-neutral-50 dark:hover:bg-[#222] transition">
                      <div class="w-8 h-8 rounded-md flex items-center justify-center font-mono text-xs font-bold" :class="b.avatarColor">
                        <span x-text="b.initials"></span>
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                          <span class="text-sm text-gray-900 dark:text-white font-medium truncate" x-text="b.name"></span>
                          <span class="font-mono text-xs text-neutral-500" x-text="b.time"></span>
                        </div>
                        <div class="font-mono text-xs text-neutral-500 mt-0.5" x-text="b.service"></div>
                      </div>
                      <span class="font-mono text-xs px-2 py-0.5 rounded" :class="b.statusColor" x-text="b.status"></span>
                    </div>
                  </template>
                </div>
              </div>

              <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-mono text-sm text-gray-900 dark:text-white font-semibold">ops tasks</h3>
                  <span class="font-mono text-xs bg-amber-50 dark:bg-amber-500/10 text-amber-600 border border-amber-200 dark:border-amber-500/20 px-2 py-0.5 rounded">4 open</span>
                </div>
                <div class="space-y-2">
                  <template x-for="t in tasks" :key="t.id">
                    <div class="flex items-center gap-3 p-3 rounded-lg hover:bg-neutral-50 dark:hover:bg-[#222] transition">
                      <div class="w-4 h-4 rounded border-2 flex items-center justify-center shrink-0"
                           :class="t.done ? 'border-green-600 dark:border-green-500 bg-green-50 dark:bg-green-500/10' : 'border-neutral-300 dark:border-neutral-700'">
                        <span x-show="t.done" class="text-green-600 dark:text-green-500 text-xs font-bold">+</span>
                      </div>
                      <span class="text-sm flex-1" :class="t.done ? 'text-neutral-400 line-through' : 'text-gray-700 dark:text-gray-300'" x-text="t.text"></span>
                      <span class="font-mono text-xs px-2 py-0.5 rounded" :class="t.priorityColor" x-text="t.priority"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Clients table -->
            <div class="bg-white dark:bg-[#1a1a1a] rounded-xl border border-neutral-200 dark:border-neutral-800 p-6">
              <h3 class="font-mono text-sm text-gray-900 dark:text-white font-semibold mb-4">active clients</h3>
              <div class="overflow-x-auto">
